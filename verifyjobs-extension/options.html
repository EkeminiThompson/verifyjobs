<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VerifyJobs Options</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 480px;
      margin: 24px auto;
      padding: 0 16px;
      color: #0f172a;
    }
    h1 { font-size: 18px; margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 13px; }
    input[type="url"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 12px;
    }
    button {
      background: #0d9488;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #0f766e; }
    .note {
      margin-top: 16px;
      font-size: 12px;
      color: #64748b;
      line-height: 1.5;
    }
    #status {
      margin-top: 12px;
      font-size: 13px;
      color: #059669;
    }
  </style>
</head>
<body>
  <h1>VerifyJobs Settings</h1>

  <label for="apiBase">API Base URL</label>
  <input type="url" id="apiBase" placeholder="http://localhost:3000" />

  <button id="saveBtn">Save</button>
  <div id="status"></div>

  <p class="note">
    Point this to your running VerifyJobs server (the one from <code>server.js</code>).<br>
    Default is <code>http://localhost:3000</code>.<br>
    For production you can set it to your deployed URL.<br>
    The extension calls <code>POST /analyze</code> and <code>POST /analyze-url</code>.
  </p>

  <script src="options.js"></script>
</body>
</html>
