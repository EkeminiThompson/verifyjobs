<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VerifyJobs Side Panel</title>
  <link rel="stylesheet" href="popup.css" />
  <style>
    body { width: 100%; min-height: 100vh; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <path d="M9 12l2 2 4-4"/>
        <circle cx="12" cy="12" r="10"/>
      </svg>
      <span>VerifyJobs</span>
    </div>
    <button id="settingsBtn" class="icon-btn" title="Settings" aria-label="Settings">⚙</button>
  </div>

  <div id="inputSection" class="section">
    <p class="hint" style="margin-bottom:12px;">Side panel mode — results stay open while you browse.</p>
    <div class="tabs">
      <button class="tab active" data-tab="text">Paste Text</button>
      <button class="tab" data-tab="url">URL</button>
      <button class="tab" data-tab="page">This Page</button>
    </div>
    <div id="textPanel" class="panel active">
      <textarea id="jobText" placeholder="Paste job description…" rows="8"></textarea>
      <input id="jobTitle" type="text" placeholder="Job title (optional)" />
    </div>
    <div id="urlPanel" class="panel">
      <input id="jobUrl" type="url" placeholder="https://…" />
    </div>
    <div id="pagePanel" class="panel">
      <p class="hint">Analyzes the active tab’s URL.</p>
    </div>
    <button id="analyzeBtn" class="primary">Analyze Job</button>
  </div>

  <div id="loadingSection" class="section hidden">
    <div class="spinner"></div>
    <p>Scanning…</p>
  </div>

  <div id="resultSection" class="section hidden">
    <div id="verdictCard" class="verdict-card">
      <div id="verdictLabel" class="verdict-label">—</div>
      <p id="verdictSummary" class="verdict-summary"></p>
      <div id="scamPattern" class="scam-pattern hidden"></div>
    </div>

    <div class="score-row">
      <div class="score-box" id="riskBox">
        <div class="score-label">Risk</div>
        <div class="score-value" id="riskScore">—</div>
      </div>
      <div class="score-box" id="legitBox">
        <div class="score-label">Legitimacy</div>
        <div class="score-value" id="legitScore">—</div>
      </div>
    </div>

    <div id="reasonsSection" class="flags-section">
      <h3>Why this verdict</h3>
      <ul id="reasonsList"></ul>
    </div>

    <div id="nextStepsSection" class="flags-section">
      <h3>What to do next</h3>
      <ol id="nextStepsList"></ol>
    </div>

    <div id="redFlags" class="flags-section hidden">
      <h3>All red flags</h3>
      <ul id="redFlagsList"></ul>
    </div>

    <div id="positiveSignals" class="flags-section hidden">
      <h3>Positive signals</h3>
      <ul id="positiveList"></ul>
    </div>

    <div id="metaInfo" class="meta"></div>
    <button id="newCheckBtn" class="secondary">Check another</button>
  </div>

  <div id="errorSection" class="section hidden">
    <div class="error-box">
      <strong>Error</strong>
      <p id="errorMessage"></p>
    </div>
    <button id="retryBtn" class="secondary">Try again</button>
  </div>

  <script src="decision.js"></script>
  <script src="popup.js"></script>
</body>
</html>
